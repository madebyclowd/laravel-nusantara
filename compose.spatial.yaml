# Local MySQL + PostgreSQL/PostGIS containers for the spatial test suite —
# same credentials/ports the live-DB tests already assume
# (tests/Feature/Geocoding/GeocoderSpatialPushdownTest.php and friends), so
# no extra config is needed once these are up.
#
# Usage:
#   docker compose -f compose.spatial.yaml up -d
#   vendor/bin/phpunit --testsuite=Spatial
#   docker compose -f compose.spatial.yaml down -v
#
# SpatiaLite isn't included here — it's a loadable SQLite extension, not a
# service container, and needs a PHP build with PDO_SQLite extension-loading
# support this environment doesn't have (see
# ai-docs/02_planning/laravel-nusantara-plan-spatial-decode.md).

services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: testdb
      MYSQL_USER: testuser
      MYSQL_PASSWORD: testpassword
    ports:
      - '3306:3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-utestuser', '-ptestpassword']
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: 'TestPassword123!'
      MSSQL_PID: Developer
    ports:
      - '1433:1433'
    healthcheck:
      test: ['CMD-SHELL', '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "TestPassword123!" -C -Q "SELECT 1" || exit 1']
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
