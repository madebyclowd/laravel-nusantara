# Local MySQL + PostgreSQL/PostGIS containers for the spatial test suite —
# same credentials/ports the live-DB tests already assume
# (tests/Feature/Geocoding/GeocoderSpatialPushdownTest.php and friends), so
# no extra config is needed once these are up.
#
# Usage:
#   docker compose -f compose.spatial.yaml up -d
#   vendor/bin/phpunit --testsuite=Spatial
#   docker compose -f compose.spatial.yaml down -v
#
# SQL Server and SpatiaLite are intentionally not included here — this
# package's spatial decode/pushdown is only verified against MySQL and
# PostgreSQL/PostGIS so far (see ai-docs/02_planning/laravel-nusantara-plan-spatial-decode.md).

services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: testdb
      MYSQL_USER: testuser
      MYSQL_PASSWORD: testpassword
    ports:
      - '3306:3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-utestuser', '-ptestpassword']
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10
